# Craftax PPO / PPO-RNN in JAX (python train_craftax.py). Defaults follow the
# Craftax PPO baselines; check them against the run you want to reproduce.
seed: 0
name: null                 # default: <env>-[PPO_RNN-][MoE-][ICM-]<steps>M, like the reference W&B runs
output_dir: ./runs/craftax
log_every: 10              # updates between metric lines
checkpoint_every: 50       # updates between checkpoints (also the jit chunk size)
resume: true               # continue from output_dir/checkpoint.npz if present
max_updates_per_run: null  # stop after this many updates in one process (time-limited jobs)

algo:
  env_name: Craftax-Symbolic-v1    # or Craftax-Classic-Symbolic-v1
  total_timesteps: 1000000000
  num_envs: 1024
  num_steps: 64
  update_epochs: 4
  num_minibatches: 8
  lr: 2.0e-4
  anneal_lr: true
  gamma: 0.99
  gae_lambda: 0.8
  clip_eps: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 1.0
  layer_size: 512
  num_layers: 3
  activation: tanh                 # the RNN variant uses relu
  rnn: false
  moe: false
  num_experts: 4
  top_k: 2
  moe_aux_coef: 0.01
  optimistic_resets: true
  reset_ratio: 16
  icm: false
  icm_reward_coef: 0.01            # bonus is normalized to mean 1 before this scale
  icm_lr: 3.0e-4
  icm_forward_coef: 1.0
  icm_inverse_coef: 1.0
  icm_normalize: true

wandb:
  enabled: false
  project: Craftax_Baselines
